# Blueprint Render — MarchéLink (API Express + Web React + PostgreSQL)
# Déploiement : connecter ce repo sur https://dashboard.render.com → "New +" → "Blueprint".
# Render lit ce fichier et provisionne les 3 ressources ci-dessous.
#
# ⚠️ À renseigner manuellement dans le dashboard (marqués `sync: false`) :
#   - ANTHROPIC_API_KEY (clé du chatbot)
#   - CORS_ALLOWED_ORIGINS (URL finale du front)
#   - VITE_API_BASE_URL (URL finale de l'API + /api)
#
# ⚠️ Le plan `free` de la base expire après 30 jours — passer en `basic`/payant
#    (~7 $/mois) pour un usage réel.

databases:
  - name: marchelink-db
    databaseName: marchelink
    user: marchelink
    plan: free
    region: frankfurt

services:
  # ── API Express (Node) ───────────────────────────────────────────
  - type: web
    name: marchelink-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: .
    # `--prod=false` : NODE_ENV=production fait sauter les devDeps à pnpm, or le
    # build (tsc + @types/*) ET les migrations runtime (tsx) en ont besoin. Render
    # ne purge pas les devDeps après build → tsx reste dispo pour `db:migrate`.
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm -F api build
    # Plan `free` : `preDeployCommand` non supporté → on enchaîne migrations Knex
    # puis démarrage dans le `startCommand` (migrate idempotent, rejoué à chaque deploy).
    # ⚠️ TEMPORAIRE : `db:seed` injecte les données de démo une fois en prod.
    # À RETIRER après le 1er déploiement réussi (le seed efface tout à chaque run →
    # un cold-start du plan free rejouerait le wipe). Revenir à : db:migrate && start.
    startCommand: pnpm -F api db:migrate && pnpm -F api db:seed && pnpm -F api start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: marchelink-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL_SEC
        value: "900"
      - key: JWT_REFRESH_TTL_SEC
        value: "604800"
      - key: COOKIE_SECURE
        value: "true"
      - key: ANTHROPIC_MODEL
        value: claude-3-5-sonnet-latest
      # À définir dans le dashboard après le 1er déploiement :
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  # ── Web React (build statique Vite) ──────────────────────────────
  - type: web
    name: marchelink-web
    runtime: static
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm -F web build
    staticPublishPath: apps/web/dist
    # SPA : toutes les routes renvoient index.html (React Router côté client).
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Injecté au BUILD (Vite inline les VITE_*). Mettre l'URL de l'API + /api.
      - key: VITE_API_BASE_URL
        sync: false
