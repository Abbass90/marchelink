name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: marchelink
          POSTGRES_PASSWORD: marchelink
          POSTGRES_DB: marchelink_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U marchelink"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      DATABASE_URL: postgres://marchelink:marchelink@localhost:5432/marchelink_test
      DATABASE_URL_TEST: postgres://marchelink:marchelink@localhost:5432/marchelink_test
      JWT_ACCESS_SECRET: ci_only_access_secret_min_32_chars_xxxxx
      JWT_REFRESH_SECRET: ci_only_refresh_secret_min_32_chars_xxxx

    steps:
      - uses: actions/checkout@v4
      # Version pnpm lue depuis le champ `packageManager` du package.json racine
      # (source unique de vérité, partagée avec corepack sur Render).
      - uses: pnpm/action-setup@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # API : avec couverture — applique le gate §26 (70% services/repos)
      - run: pnpm -F api test:cov
      # Web : suite Vitest
      - run: pnpm -F web test
